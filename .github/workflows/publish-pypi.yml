name: Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Verify release metadata
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
      run: python3 scripts/check_release.py

    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.11"

    - name: Build distributions
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Check distributions
      run: |
        python -m pip install --upgrade twine
        twine check dist/*
        python scripts/check_release.py --dist dist

    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: python-dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/proxmox-mcp-plus/
    permissions:
      id-token: write
      contents: read
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Download build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: python-dist
        path: dist/

    - name: Verify existing PyPI artifacts
      id: preflight
      run: |
        version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
        python3 scripts/check_pypi_publication.py --dist dist --version "$version"

    - name: Publish to PyPI with API token
      if: ${{ steps.preflight.outputs.publish_needed == 'true' && env.PYPI_API_TOKEN != '' }}
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      with:
        password: ${{ env.PYPI_API_TOKEN }}

    - name: Publish to PyPI with trusted publishing
      if: ${{ steps.preflight.outputs.publish_needed == 'true' && env.PYPI_API_TOKEN == '' }}
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
