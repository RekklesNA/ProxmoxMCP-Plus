name: Publish MCP Registry Metadata

on:
  workflow_run:
    workflows: ["Publish Python Package"]
    types: [completed]
  workflow_dispatch:

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}

    - name: Verify release metadata
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
      run: python3 scripts/check_release.py

    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.11"

    - name: Resolve registry package version
      id: version
      shell: bash
      run: |
        version=$(python - <<'PY'
        import json
        from pathlib import Path

        print(json.loads(Path("server.json").read_text(encoding="utf-8"))["version"])
        PY
        )
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Wait for PyPI release visibility
      shell: bash
      env:
        PACKAGE_NAME: proxmox-mcp-plus
        PACKAGE_VERSION: ${{ steps.version.outputs.version }}
      run: |
        python - <<'PY'
        import json
        import os
        import sys
        import time
        import urllib.request

        package_name = os.environ["PACKAGE_NAME"]
        package_version = os.environ["PACKAGE_VERSION"]
        url = f"https://pypi.org/pypi/{package_name}/json"

        for attempt in range(1, 19):
            with urllib.request.urlopen(url, timeout=30) as response:
                payload = json.load(response)
            releases = payload.get("releases", {})
            if releases.get(package_version):
                print(f"Found {package_name}=={package_version} on PyPI.")
                sys.exit(0)
            print(
                f"Attempt {attempt}/18: {package_name}=={package_version} "
                "is not visible on PyPI yet. Waiting 10 seconds..."
            )
            time.sleep(10)

        raise SystemExit(
            f"{package_name}=={package_version} did not become visible on PyPI in time."
        )
        PY

    - name: Install mcp-publisher
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --location --output publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
        echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  publisher.tar.gz" | sha256sum --check
        tar xzf publisher.tar.gz mcp-publisher
        chmod +x ./mcp-publisher

    - name: Authenticate to MCP Registry
      run: ./mcp-publisher login github-oidc

    - name: Publish server to MCP Registry
      run: ./mcp-publisher publish
