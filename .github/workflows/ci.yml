name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: proxmox_mcp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d proxmox_mcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MCP_OAUTH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/proxmox_mcp_test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements/dev.in
        pip install pip-audit
        pip install .

    - name: Smoke Test (Import Server)
      run: |
        python -c "from proxmox_mcp.server import ProxmoxMCPServer; print('Successfully imported ProxmoxMCPServer')"

    - name: Run tests
      run: |
        pytest -q --cov=proxmox_mcp --cov-report=term-missing --cov-fail-under=75

    - name: Ruff
      run: |
        ruff check .

    - name: Mypy
      run: |
        mypy src --ignore-missing-imports

    - name: Build package
      run: |
        python -m build
        python -m pip install --upgrade twine
        twine check dist/*
        python scripts/check_release.py --dist dist

    - name: pip-audit
      run: |
        pip-audit -r requirements.txt

    - name: Validate Manifest JSON
      run: |
        if ! command -v jq &> /dev/null; then sudo apt-get install jq; fi
        jq empty manifest.json
