name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  container-smoke:
    name: Container build and health
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Build the reviewed Dockerfile without publishing
      run: docker build --tag proxmox-mcp-pr:smoke .
    - name: Verify AMD64 application health and runtime hardening
      shell: bash
      run: |
        set -euo pipefail
        container_name="proxmox-mcp-pr-smoke"
        trap 'docker logs "$container_name" || true; docker rm -f "$container_name" || true' EXIT
        docker run --detach --name "$container_name" \
          --cap-drop ALL --security-opt no-new-privileges:true \
          --publish 127.0.0.1:18811:8811 \
          --volume "$PWD/proxmox-config/config.example.json:/app/proxmox-config/config.json:ro" \
          --env PROXMOX_API_KEY=pr-smoke-check proxmox-mcp-pr:smoke
        for attempt in {1..30}; do
          if curl --fail --silent http://127.0.0.1:18811/livez > /dev/null; then
            break
          fi
          test "$(docker inspect "$container_name" --format '{{.State.Running}}')" = "true"
          sleep 2
        done
        curl --fail --silent --show-error http://127.0.0.1:18811/livez | jq -e '.status == "ok"'
        test "$(docker exec "$container_name" uname -m)" = "x86_64"
        test "$(docker exec "$container_name" id -u)" != "0"
        docker exec "$container_name" sh -c 'test ! -e /usr/local/bin/pip && ! python -m pip --version >/dev/null 2>&1'

    - name: Verify native MCP HTTP authentication with dropped capabilities
      shell: bash
      run: |
        set -euo pipefail
        container_name="proxmox-mcp-pr-native"
        native_api_key="$(openssl rand -hex 32)"
        echo "::add-mask::$native_api_key"
        trap 'docker logs "$container_name" || true; docker rm -f "$container_name" || true' EXIT
        docker run --detach --name "$container_name" \
          --cap-drop ALL --security-opt no-new-privileges:true \
          --publish 127.0.0.1:18800:8000 \
          --volume "$PWD/proxmox-config/config.example.json:/app/proxmox-config/config.json:ro" \
          --env PROXMOX_MCP_MODE=mcp-http --env "MCP_API_KEY=$native_api_key" proxmox-mcp-pr:smoke
        for attempt in {1..30}; do
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18800/mcp || true)"
          if test "$status" = "401"; then break; fi
          test "$(docker inspect "$container_name" --format '{{.State.Running}}')" = "true"
          sleep 2
        done
        test "$status" = "401"
        curl --fail --silent --show-error http://127.0.0.1:18800/mcp \
          --header "Authorization: Bearer $native_api_key" \
          --header 'Content-Type: application/json' --header 'Accept: application/json, text/event-stream' \
          --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"1"}}}' > native-initialize.txt
        grep -q '"serverInfo"' native-initialize.txt
        test "$(docker exec "$container_name" id -u)" != "0"

    - name: Verify both modes reject missing credentials at startup
      shell: bash
      run: |
        set -euo pipefail
        trap 'docker rm -f proxmox-mcp-missing-openapi proxmox-mcp-missing-mcp-http >/dev/null 2>&1 || true' EXIT
        for mode in openapi mcp-http; do
          if timeout 30s docker run --name "proxmox-mcp-missing-$mode" \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --volume "$PWD/proxmox-config/config.example.json:/app/proxmox-config/config.json:ro" \
            --env PROXMOX_MCP_MODE="$mode" proxmox-mcp-pr:smoke > "missing-$mode.log" 2>&1; then
            cat "missing-$mode.log"
            exit 1
          fi
        done
        grep -q 'refuses to start without PROXMOX_API_KEY' missing-openapi.log
        grep -q 'MCP_API_KEY must be set' missing-mcp-http.log

  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: proxmox_mcp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d proxmox_mcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MCP_OAUTH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/proxmox_mcp_test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements/runtime.lock
        pip install -r requirements/dev.in
        pip install pip-audit
        pip install --no-deps .

    - name: Smoke Test (Import Server)
      run: |
        python -c "from proxmox_mcp.server import ProxmoxMCPServer; print('Successfully imported ProxmoxMCPServer')"

    - name: Run tests
      run: |
        docker compose version
        pytest -q --cov=proxmox_mcp --cov-branch --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=0
        python scripts/check_coverage.py coverage.json --require-branches

    - name: Ruff
      run: |
        ruff check .

    - name: Mypy
      run: |
        mypy src --ignore-missing-imports

    - name: Build package
      run: |
        python -m build
        python -m pip install --upgrade twine
        twine check dist/*
        python scripts/check_release.py --dist dist

    - name: pip-audit
      run: |
        pip-audit -r requirements/runtime.lock --format cyclonedx-json --output sbom.json

    - name: Validate Manifest JSON
      run: |
        if ! command -v jq &> /dev/null; then sudo apt-get install jq; fi
        jq empty manifest.json

    - name: Record resolved environment
      if: always()
      run: python -m pip inspect > installed-environment.json

    - name: Upload verification evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: validation-python-${{ matrix.python-version }}
        path: |
          coverage.json
          sbom.json
          installed-environment.json

  windows-contracts:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - name: Install locked runtime and test dependencies
      run: |
        python -m pip install --require-hashes -r requirements/runtime.lock
        python -m pip install -r requirements/dev.in
    - name: Verify platform-independent command and HTTP contracts
      run: python -m pytest tests/test_project_audit_fixes.py tests/test_project_audit_edges.py tests/test_container_console.py tests/test_tool_filtering.py tests/test_runtime_performance.py -q
