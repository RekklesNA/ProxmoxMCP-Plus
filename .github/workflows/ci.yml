name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: proxmox_mcp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d proxmox_mcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MCP_OAUTH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/proxmox_mcp_test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements/runtime.lock
        pip install -r requirements/dev.in
        pip install pip-audit
        pip install --no-deps .

    - name: Smoke Test (Import Server)
      run: |
        python -c "from proxmox_mcp.server import ProxmoxMCPServer; print('Successfully imported ProxmoxMCPServer')"

    - name: Run tests
      run: |
        pytest -q --cov=proxmox_mcp --cov-branch --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=0
        python scripts/check_coverage.py coverage.json --require-branches

    - name: Ruff
      run: |
        ruff check .

    - name: Mypy
      run: |
        mypy src --ignore-missing-imports

    - name: Build package
      run: |
        python -m build
        python -m pip install --upgrade twine
        twine check dist/*
        python scripts/check_release.py --dist dist

    - name: pip-audit
      run: |
        pip-audit -r requirements/runtime.lock --format cyclonedx-json --output sbom.json

    - name: Validate Manifest JSON
      run: |
        if ! command -v jq &> /dev/null; then sudo apt-get install jq; fi
        jq empty manifest.json

    - name: Record resolved environment
      if: always()
      run: python -m pip inspect > installed-environment.json

    - name: Upload verification evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: validation-python-${{ matrix.python-version }}
        path: |
          coverage.json
          sbom.json
          installed-environment.json

  windows-contracts:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.12"
    - name: Install locked runtime and test dependencies
      run: |
        python -m pip install --require-hashes -r requirements/runtime.lock
        python -m pip install -r requirements/dev.in
    - name: Verify platform-independent command and HTTP contracts
      run: python -m pytest tests/test_project_audit_fixes.py tests/test_project_audit_edges.py tests/test_container_console.py tests/test_tool_filtering.py tests/test_runtime_performance.py -q
