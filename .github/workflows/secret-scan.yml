name: Secret Scanning

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned scanner
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all tracked files
        run: |
          scan_dir="$(mktemp -d "$RUNNER_TEMP/secret-snapshot.XXXXXX")"
          git archive HEAD | tar -x -C "$scan_dir"
          "$RUNNER_TEMP/gitleaks" dir "$scan_dir" --config .gitleaks.toml \
            --redact --ignore-gitleaks-allow --no-banner --report-format json \
            --report-path "$RUNNER_TEMP/secrets-current.json"
      - name: Scan every commit introduced by the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git . --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --config .gitleaks.toml --redact --ignore-gitleaks-allow --no-banner --report-format json \
            --report-path "$RUNNER_TEMP/secrets-commits.json"
      - name: Upload redacted scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: secret-scan-reports
          path: ${{ runner.temp }}/secrets-*.json
          if-no-files-found: warn
