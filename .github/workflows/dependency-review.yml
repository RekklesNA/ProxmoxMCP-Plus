name: Dependency Security

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: false
          warn-only: false
          retry-on-snapshot-warnings: true

  runtime-audit:
    name: Runtime dependency audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install audit tool
        run: python -m pip install pip-audit==2.10.1
      # GitHub's dependency graph does not discover the custom runtime.lock name.
      # Audit its exact pins without installing or executing PR dependencies.
      - name: Audit hashed runtime lock
        run: >-
          python -m pip_audit -r requirements/runtime.lock
          --require-hashes --disable-pip --strict
          --format json --output runtime-audit.json
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-dependency-audit-${{ matrix.os }}
          path: runtime-audit.json
          if-no-files-found: warn
